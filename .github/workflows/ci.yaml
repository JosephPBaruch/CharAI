name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t django-backend .

      - name: Build frontend Docker image
        run: |
          cd frontend
          docker build -t char-ai-frontend .
          docker build \
            --build-arg VITE_API_URL="http://localhost/api" \
            --build-arg VITE_APP_URL="http://localhost" \
            -t char-ai-frontend .

      - name: Create test network
        run: docker network create charai-net

      - name: Run backend container
        run: |
          docker run -d \
            -p 8000:8000 \
            -e DEBUG=True \
            -e SECRET_KEY=ci-test-key \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=sqlite:///db.sqlite3 \
            --network charai-net \
            --name django-backend \
            django-backend

      - name: Run frontend container
        run: |
          docker run -d \
            -p 80:80 \
            -e BACKEND_HOST=django-backend \
            -e BACKEND_PORT=8000 \
            --network charai-net \
            --name char-ai-frontend \
            char-ai-frontend

      - name: Install Playwright dependencies
        run: |
          cd frontend/tests
          npm install
          npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost
        run: |
          cd frontend/tests
          echo "Running tests against BASE_URL=$BASE_URL"
          npm run test:report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/playwright-report/

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker logs django-backend || true
          echo ""
          echo "=== Frontend logs ==="
          docker logs char-ai-frontend || true

      - name: Cleanup containers
        if: always()
        run: |
          docker stop django-backend char-ai-frontend || true
          docker rm django-backend char-ai-frontend || true
