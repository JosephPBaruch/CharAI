name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t django-backend .

      - name: Build frontend Docker image
        run: |
          cd frontend
          docker build -t char-ai-frontend .

      - name: Create test network
        run: docker network create charai-net

      - name: Run PostgreSQL container
        run: |
          docker run -d \
            -e POSTGRES_DB=charai_test \
            -e POSTGRES_USER=charai \
            -e POSTGRES_PASSWORD=testpass \
            --network charai-net \
            --name postgres-test \
            postgres:16-alpine

      - name: Wait for PostgreSQL to be ready
        run: |
          timeout 30 bash -c 'until docker exec postgres-test pg_isready -U charai > /dev/null; do sleep 1; done'

      - name: Run backend container
        run: |
          docker run -d \
            -p 8000:8000 \
            -e DEBUG=True \
            -e SECRET_KEY=ci-test-key \
            -e DATABASE_URL=postgresql://charai:testpass@postgres-test:5432/charai_test \
            -e OPENTOPOGRAPHY_API_KEY=keykey \
            -e ALLOWED_HOSTS=localhost,127.0.0.1,char-ai-frontend \
            --network charai-net \
            --name django-backend \
            django-backend

      - name: Run database migrations
        run: |
          docker exec django-backend python manage.py migrate

      - name: Run frontend container
        run: |
          docker run -d \
            -p 80:80 \
            -e BACKEND_URL=django-backend:8000 \
            -e LOG_LEVEL=DEBUG \
            --network charai-net \
            --name char-ai-frontend \
            char-ai-frontend

      - name: Install Playwright dependencies
        run: |
          cd frontend/tests
          npm install
          npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost
        run: |
          cd frontend/tests
          echo "Running tests against BASE_URL=$BASE_URL"
          npm run test:report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/playwright-report/

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker logs django-backend || true
          echo ""
          echo "=== Frontend logs ==="
          docker logs char-ai-frontend || true

      - name: Cleanup containers
        if: always()
        run: |
          docker stop django-backend char-ai-frontend postgres-test || true
          docker rm django-backend char-ai-frontend postgres-test || true

      - name: Login to Azure Container Registry
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.AZURE_REGISTRY_PASSWORD }}" | docker login \
            -u "${{ secrets.AZURE_REGISTRY_USERNAME }}" \
            --password-stdin \
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}

      - name: Push backend image to Azure Container Registry
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag django-backend ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-backend:${{ github.sha }}
          docker tag django-backend ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-backend:latest
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-backend:${{ github.sha }}
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-backend:latest

      - name: Push frontend image to Azure Container Registry
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag char-ai-frontend ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-frontend:${{ github.sha }}
          docker tag char-ai-frontend ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-frontend:latest
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-frontend:${{ github.sha }}
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-frontend:latest
