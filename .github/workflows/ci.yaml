name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t django-backend .

      - name: Build frontend Docker image
        run: |
          cd frontend
          docker build -t char-ai-frontend .
          docker build \
            --build-arg VITE_API_URL="http://localhost:8000/api" \
            --build-arg VITE_APP_URL="http://localhost:5173" \
            -t char-ai-frontend .

      - name: Run backend container
        run: |
          docker run -d \
            -p 8000:8000 \
            -e DEBUG=True \
            -e SECRET_KEY=ci-test-key \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=sqlite:///db.sqlite3 \
            --name django-backend \
            django-backend

      - name: Run frontend container
        run: |
          docker run -d \
            -p 5173:5173 \
            --name char-ai-frontend \
            char-ai-frontend

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:8000 2>/dev/null; do sleep 2; done' || true
          sleep 5

          echo "Waiting for frontend to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:5173 2>/dev/null; do sleep 2; done' || true
          sleep 5

      - name: Validate backend endpoint
        run: |
          echo "Testing backend endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 || echo "000")
          echo "Backend response code: $response"
          if [ "$response" = "000" ]; then
            echo "Backend endpoint is not accessible"
            exit 1
          else
            echo "Backend endpoint is accessible (HTTP $response)"
          fi

      - name: Validate frontend endpoint
        run: |
          echo "Testing frontend endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 || echo "000")
          echo "Frontend response code: $response"
          if [ "$response" = "000" ]; then
            echo "Frontend endpoint is not accessible"
            exit 1
          else
            echo "Frontend endpoint is accessible (HTTP $response)"
          fi

      - name: Additional wait for Playwright
        run: |
          echo "Waiting additional time for services to stabilize..."
          sleep 10
          echo "Testing frontend reachability one more time..."
          curl -v http://localhost:5173 || true
          echo "\nDocker container status:"
          docker ps

      - name: Install Playwright dependencies
        run: |
          cd frontend/tests
          npm install
          npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:5173
        run: |
          cd frontend/tests
          echo "Running tests against BASE_URL=$BASE_URL"
          npm run test:report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/playwright-report/

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker logs django-backend || true
          echo ""
          echo "=== Frontend logs ==="
          docker logs char-ai-frontend || true

      - name: Cleanup containers
        if: always()
        run: |
          docker stop django-backend char-ai-frontend || true
          docker rm django-backend char-ai-frontend || true
