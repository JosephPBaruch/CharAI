name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run database pipeline
        run: |
          cd database
          ./pipeline.sh

      - name: Wait for PostgreSQL to be ready
        run: |
          timeout 30 bash -c 'until docker exec postgres-test pg_isready -U charai > /dev/null; do sleep 1; done'

      - name: Run backend pipeline
        run: |
          cd backend
          ./pipeline.sh --opentopokey=${{ secrets.OPENTOPOGRAPHY_API_KEY }}

      - name: Run database migrations
        run: |
          docker exec django-backend python manage.py migrate

      - name: Run frontend pipeline
        run: |
          cd frontend
          ./pipeline.sh

      - name: Install Playwright dependencies
        run: |
          cd frontend/tests
          npm install
          npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost
        run: |
          cd frontend/tests
          echo "Running tests against BASE_URL=$BASE_URL"
          npm run test:report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/tests/playwright-report/

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker logs django-backend || true
          echo ""
          echo "=== Frontend logs ==="
          docker logs char-ai-frontend || true

      - name: Cleanup containers
        if: always()
        run: |
          docker stop django-backend char-ai-frontend postgres-test || true
          docker rm django-backend char-ai-frontend postgres-test || true

