name: CI

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images with cache
        uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          OPENTOPOGRAPHY_API_KEY: ${{ secrets.OPENTOPOGRAPHY_API_KEY }}
          CACHEBUST: ${{ github.sha }}

      - name: Start services
        run: docker compose up -d --wait
        env:
          OPENTOPOGRAPHY_API_KEY: ${{ secrets.OPENTOPOGRAPHY_API_KEY }}
          EARTH_DATA_API_KEY: ${{ secrets.EARTH_DATA_API_KEY }}

      - name: Run database migrations
        run: docker exec django-backend python manage.py migrate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/tests/package-lock.json

      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./frontend/tests/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright dependencies
        run: |
          cd frontend/tests
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps
          else
            npx playwright install-deps
          fi

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost
        run: |
          cd frontend/tests
          echo "Running tests against BASE_URL=$BASE_URL"
          npm run test:report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/playwright-report/

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker logs django-backend || true
          echo ""
          echo "=== Frontend logs ==="
          docker logs char-ai-frontend || true

      - name: Cleanup
        if: always()
        run: docker compose down

      - name: Login to Azure Container Registry
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.AZURE_REGISTRY_PASSWORD }}" | docker login \
            -u "${{ secrets.AZURE_REGISTRY_USERNAME }}" \
            --password-stdin \
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}

      - name: Push backend image to Azure Container Registry
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag django-backend ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-backend:${{ github.sha }}
          docker tag django-backend ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-backend:latest
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-backend:${{ github.sha }}
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-backend:latest

      - name: Push frontend image to Azure Container Registry
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag char-ai-frontend ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-frontend:${{ github.sha }}
          docker tag char-ai-frontend ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-frontend:latest
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-frontend:${{ github.sha }}
          docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/charai-frontend:latest
